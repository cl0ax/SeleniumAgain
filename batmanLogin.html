<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selenium Practice - Login App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
    }

    .login-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .error-message {
      color: #e74c3c;
      background: #ffeaea;
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
      border-left: 4px solid #e74c3c;
    }

    .welcome-page {
      display: none;
      text-align: center;
    }

    .welcome-page h1 {
      color: #27ae60;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .welcome-message {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: #c0392b;
    }

    .hint {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
      font-size: 14px;
      color: #666;
    }

    .hint strong {
      color: #333;
    }
  </style>
</head>
<body>
<!-- Login Form -->
<div class="container" id="loginContainer">
  <h1>🦸‍♂️ Selenium Practice Login</h1>

  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter password">
    </div>

    <button type="submit" class="login-btn" id="loginBtn">Login</button>
  </form>

  <div class="error-message" id="errorMessage">
    ❌ Invalid username or password. Please try again.
  </div>

  <div class="hint">
    <strong>🔍 For Selenium Testing:</strong><br>
    Username: <code>batman</code><br>
    Password: <code>joker</code>
  </div>
</div>

<!-- Welcome Page -->
<div class="container welcome-page" id="welcomePage">
  <h1>🎉 Welcome!</h1>
  <div class="welcome-message">
    <p>Hello <strong id="welcomeUser"></strong>!</p>
    <p>You have successfully logged in to the Selenium Practice App.</p>
    <p>This page is perfect for testing successful login scenarios!</p>
  </div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</div>

<script>
  // Get form elements
  const loginForm = document.getElementById('loginForm');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const errorMessage = document.getElementById('errorMessage');
  const loginContainer = document.getElementById('loginContainer');
  const welcomePage = document.getElementById('welcomePage');
  const welcomeUser = document.getElementById('welcomeUser');
  const logoutBtn = document.getElementById('logoutBtn');

  // Handle form submission
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent actual form submission

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    // Hide any previous error messages
    errorMessage.style.display = 'none';

    // Check credentials
    if (username === 'batman' && password === 'joker') {
      // Successful login
      console.log('Login successful!');

      // Hide login form and show welcome page
      loginContainer.style.display = 'none';
      welcomePage.style.display = 'block';
      welcomeUser.textContent = username;

      // Change page title for Selenium verification
      document.title = 'Welcome - Selenium Practice App';

    } else {
      // Failed login
      console.log('Login failed!');

      // Show error message
      errorMessage.style.display = 'block';

      // Clear password field for security
      passwordInput.value = '';

      // Focus back on username field
      usernameInput.focus();
    }
  });

  // Handle logout
  logoutBtn.addEventListener('click', function() {
    // Reset everything
    loginContainer.style.display = 'block';
    welcomePage.style.display = 'none';
    errorMessage.style.display = 'none';

    // Clear form fields
    usernameInput.value = '';
    passwordInput.value = '';

    // Reset page title
    document.title = 'Selenium Practice - Login App';

    // Focus on username field
    usernameInput.focus();
  });

  // Focus on username field when page loads
  window.addEventListener('load', function() {
    usernameInput.focus();
  });

  // Add some helpful console logs for debugging
  console.log('🎯 Selenium Practice Login App Loaded!');
  console.log('Valid credentials: username="batman", password="joker"');
</script>
</body>
</html>
